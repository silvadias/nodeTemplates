services:
  server:
    image: node:22-alpine
    container_name: nodeContainer
    working_dir: /usr/src/app
    entrypoint: /usr/src/app/docker/setupEnvironment.sh 
    ports:
      - "${PORT}:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db
    networks:
      - nodeNetwork

  db:
    image: mongo:6.0
    container_name: mongoContainer
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASSWORD}
      - MONGO_INITDB_DATABASE=${DB_NAME}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongoData:/data/db
    networks:
      - nodeNetwork

networks:
  nodeNetwork:
    driver: bridge

volumes:
  mongoData:
