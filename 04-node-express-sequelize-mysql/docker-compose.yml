services:
  server:
    image: node:24-alpine
    container_name: nodeContainer
    working_dir: /usr/src/app
    entrypoint: /usr/src/app/docker/setupEnvironment.sh 
    ports:
      - "${PORT}:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - ./database:/usr/src/app/database
    depends_on:
      - db
    networks:
      - nodeNetwork

  db:
    image: mysql:8.0
    container_name: mysqlContainer
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysqlData:/var/lib/mysql
    networks:
      - nodeNetwork

networks:
  nodeNetwork:
    driver: bridge

volumes:
  mysqlData:
