services:
  server:
    image: node:24-alpine
    container_name: nodeContainer
    working_dir: /usr/src/app
    entrypoint: /usr/src/app/docker/setupEnvironment.sh 
    ports:
      - "${PORT}:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - ./database:/usr/src/app/database
    depends_on:
      - db 
    networks:
      - nodeNetwork

  db:
    image: postgres:15-alpine
    container_name: postgresContainer
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgresData:/var/lib/postgresql/data
    networks:
      - nodeNetwork

networks:
  nodeNetwork:
    driver: bridge

volumes:
  postgresData:
